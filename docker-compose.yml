# Digital Penang LMS
# Official Frappe Learning Docker setup (from frappe/lms docker/), wrapped for:
#   site: lms.iyazbrhm.cloud
#   Cloudflare Tunnel → http://localhost:8090
#
# Upstream: https://github.com/frappe/lms/tree/develop/docker
# Official install steps inside init.sh:
#   bench get-app payments && bench get-app lms
#   bench new-site ... && install-app payments && install-app lms

name: digital-penang-lms

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-123}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    command: bash /workspace/init.sh
    environment:
      SHELL: /bin/bash
      SITE_NAME: ${SITE_NAME:-lms.iyazbrhm.cloud}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-0}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - frappe-home:/home/frappe
    ports:
      # Cloudflare Tunnel should target http://localhost:8090
      - "${HTTP_PUBLISH_PORT:-8090}:8000"
      - "${SOCKETIO_PUBLISH_PORT:-9000}:9000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mariadb-data:
  frappe-home:
