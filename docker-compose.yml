# Digital Penang LMS — lighter Frappe Learning clone
# Dokploy: set domain port to 3000 (container port), not 8090
# Optional host publish 8090 for Cloudflare Tunnel / direct access

name: digital-penang-lms

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Do not publish 27017 publicly in production if possible
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: ./digital-lms
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/digital-lms}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lms.iyazbrhm.cloud}
      SHOW_ERROR_DETAILS: ${SHOW_ERROR_DETAILS:-1}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@digitalpenang.my}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Digital Penang Admin}
      SEED_INSTRUCTOR_EMAIL: ${SEED_INSTRUCTOR_EMAIL:-instructor@digitalpenang.my}
      SEED_INSTRUCTOR_PASSWORD: ${SEED_INSTRUCTOR_PASSWORD:-instructor123}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@digitalpenang.my}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-student123}
      SEED_RESET_ADMIN_PASSWORD: ${SEED_RESET_ADMIN_PASSWORD:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
    expose:
      - "3000"
    ports:
      # Host 8090 for tunnel; Dokploy domain must target container port 3000
      - "${HTTP_PUBLISH_PORT:-8090}:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mongo-data:
  uploads:
